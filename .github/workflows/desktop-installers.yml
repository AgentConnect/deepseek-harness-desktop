name: Desktop installers

on:
  workflow_dispatch:
    inputs:
      prepare_test_lock:
        description: Generate an audited lock for frozen Singapore tarballs only
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: desktop-installers-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  test-lock:
    if: inputs.prepare_test_lock && github.ref == 'refs/heads/test/singapore-release-20261012'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
      - run: corepack enable
      - run: yarn install --mode=update-lockfile
        env:
          YARN_ENABLE_IMMUTABLE_INSTALLS: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: singapore-frozen-yarn-lock
          path: yarn.lock
          if-no-files-found: error

  macos-universal:
    if: (!inputs.prepare_test_lock) && github.ref != 'refs/heads/test/singapore-release-20261012'
    name: macOS universal DMG
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
      - run: corepack enable
      - name: Resolve Yarn cache folder
        id: yarn-cache
        run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: yarn-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('yarn.lock', '.yarnrc.yml') }}
      - run: yarn install --immutable
      - name: Verify frozen test package runtime bytes
        if: github.ref == 'refs/heads/test/singapore-release-20261012'
        run: node scripts/verify-singapore-test-packages.mjs
      - run: yarn workspace dsh-plugin-desktop check:mac-package
      - name: Build and verify unsigned universal DMG
        env:
          DSH_PACKAGE_CHECK_ALREADY_RAN: '1'
        run: yarn workspace dsh-plugin-desktop dist:mac-smoke
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-macos-universal-unsigned
          path: dsh-plugin-desktop/dist/mac-smoke/*.dmg
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  windows-x64:
    if: (!inputs.prepare_test_lock)
    name: Windows x64 installer and portable archive
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
      - run: corepack enable
      - name: Resolve Yarn cache folder
        id: yarn-cache
        run: echo "dir=$(yarn config get cacheFolder)" >> "$env:GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: yarn-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('yarn.lock', '.yarnrc.yml') }}
      - run: yarn install --immutable
      - name: Verify frozen test package runtime bytes
        if: github.ref == 'refs/heads/test/singapore-release-20261012'
        run: node scripts/verify-singapore-test-packages.mjs
      - run: yarn workspace dsh-plugin-desktop check:win-package
      - name: Build and verify unsigned NSIS installer
        env:
          DSH_PACKAGE_CHECK_ALREADY_RAN: '1'
        run: yarn workspace dsh-plugin-desktop dist:win
      - name: Build and verify unsigned portable archive
        env:
          DSH_PACKAGE_CHECK_ALREADY_RAN: '1'
        run: yarn workspace dsh-plugin-desktop dist:win-portable
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-windows-x64-installer-unsigned
          path: dsh-plugin-desktop/dist/DSH-Desktop-*-x64-Setup.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-windows-x64-portable-unsigned
          path: dsh-plugin-desktop/dist/DSH-Desktop-*-x64-Portable.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
