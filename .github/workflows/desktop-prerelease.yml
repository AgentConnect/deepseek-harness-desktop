name: Desktop pre-release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-prerelease
  cancel-in-progress: false

env:
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  validate:
    name: Validate pre-release version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
      - name: Require matching pre-release package versions
        id: version
        shell: bash
        run: |
          set -euo pipefail
          workspace_version="$(node -p "require('./package.json').version")"
          desktop_version="$(node -p "require('./dsh-plugin-desktop/package.json').version")"
          if [[ "$workspace_version" != "$desktop_version" ]]; then
            echo "Workspace and Desktop versions must match" >&2
            exit 1
          fi
          if [[ "$workspace_version" != *-* ]]; then
            echo "Refusing to publish a stable version from the pre-release workflow" >&2
            exit 1
          fi
          echo "version=$workspace_version" >> "$GITHUB_OUTPUT"
          echo "tag=v$workspace_version" >> "$GITHUB_OUTPUT"

  macos-universal-signed:
    name: Signed and notarized macOS universal DMG
    needs: validate
    runs-on: macos-latest
    timeout-minutes: 90
    environment: macos-release
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
      - run: corepack enable
      - name: Resolve Yarn cache folder
        id: yarn-cache
        run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: yarn-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('yarn.lock', '.yarnrc.yml') }}
      - run: yarn install --immutable
      - name: Materialize App Store Connect API key
        shell: bash
        env:
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          key_path="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APPLE_API_KEY_P8_BASE64" | openssl base64 -d -A > "$key_path"
          echo "APPLE_API_KEY=$key_path" >> "$GITHUB_ENV"
      - name: Build, sign, notarize, staple, and verify universal DMG
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: yarn workspace dsh-plugin-desktop dist:mac
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-prerelease-macos
          path: dsh-plugin-desktop/dist/mac-release/*.dmg
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Remove temporary App Store Connect API key
        if: always()
        shell: bash
        run: |
          if [[ -n "${APPLE_API_KEY:-}" ]]; then
            rm -f "$APPLE_API_KEY"
          fi

  windows-x64:
    name: Windows x64 installer and portable archive
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
      - run: corepack enable
      - name: Resolve Yarn cache folder
        id: yarn-cache
        run: echo "dir=$(yarn config get cacheFolder)" >> "$env:GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: yarn-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('yarn.lock', '.yarnrc.yml') }}
      - run: yarn install --immutable
      - run: yarn workspace dsh-plugin-desktop check:win-package
      - name: Build and verify unsigned NSIS installer
        env:
          DSH_PACKAGE_CHECK_ALREADY_RAN: '1'
        run: yarn workspace dsh-plugin-desktop dist:win
      - name: Build and verify unsigned portable archive
        env:
          DSH_PACKAGE_CHECK_ALREADY_RAN: '1'
        run: yarn workspace dsh-plugin-desktop dist:win-portable
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-prerelease-windows
          path: |
            dsh-plugin-desktop/dist/DSH-Desktop-*-x64-Setup.exe
            dsh-plugin-desktop/dist/DSH-Desktop-*-x64-Portable.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish-prerelease:
    name: Publish GitHub pre-release
    needs: [validate, macos-universal-signed, windows-x64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: dsh-desktop-prerelease-*
          path: release-assets
          merge-multiple: true
      - name: Normalize release asset filenames
        working-directory: release-assets
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          source_path="DSH Desktop-${RELEASE_VERSION}-universal.dmg"
          target_path="DSH.Desktop-${RELEASE_VERSION}-universal.dmg"
          test -f "$source_path"
          test ! -e "$target_path"
          mv -- "$source_path" "$target_path"

          if find . -maxdepth 1 -type f -name '* *' -print -quit | grep -q .; then
            echo "Release asset filenames must not contain spaces." >&2
            exit 1
          fi
      - name: Generate checksums
        working-directory: release-assets
        shell: bash
        run: sha256sum * > SHA256SUMS.txt
      - name: Create pre-release without replacing an existing tag or release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          if git rev-parse "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Refusing to replace existing tag $RELEASE_TAG" >&2
            exit 1
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Refusing to replace existing release $RELEASE_TAG" >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" release-assets/* \
            --target "$GITHUB_SHA" \
            --title "DSH Desktop $RELEASE_VERSION" \
            --prerelease \
            --generate-notes \
            --notes "This pre-release bundles @awiki/dsh-plugin@0.3.2 and @awiki/dsh-model-proxy@0.1.2 as the offline fallback for the default Desktop profile, and adds a Settings UI for discovering and installing a newer compatible stable pair from the official npm registry without rebuilding Desktop. The macOS universal DMG is Developer ID signed, notarized, stapled, and verified for Apple Silicon and Intel. The Windows x64 installer and portable archive are currently unsigned pre-release artifacts."
