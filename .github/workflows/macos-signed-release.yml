name: macOS signed release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-signed-release-${{ github.ref }}
  cancel-in-progress: false

env:
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  macos-signed-release:
    name: Signed and notarized macOS universal DMG
    runs-on: macos-latest
    timeout-minutes: 90
    environment: macos-release
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
      - run: corepack enable
      - name: Resolve Yarn cache folder
        id: yarn-cache
        run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: yarn-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('yarn.lock', '.yarnrc.yml') }}
      - run: yarn install --immutable
      - name: Materialize App Store Connect API key
        shell: bash
        env:
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          key_path="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APPLE_API_KEY_P8_BASE64" | openssl base64 -d -A > "$key_path"
          echo "APPLE_API_KEY=$key_path" >> "$GITHUB_ENV"
      - name: Build, sign, notarize, staple, and verify universal DMG
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: yarn workspace dsh-plugin-desktop dist:mac
      - name: Upload signed and notarized DMG
        uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-macos-universal-signed-notarized
          path: dsh-plugin-desktop/dist/mac-release/*.dmg
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Remove temporary App Store Connect API key
        if: always()
        shell: bash
        run: |
          if [[ -n "${APPLE_API_KEY:-}" ]]; then
            rm -f "$APPLE_API_KEY"
          fi
