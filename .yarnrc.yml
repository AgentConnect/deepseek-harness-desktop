enableScripts: false
nmHoistingLimits: workspaces
nodeLinker: node-modules

# The Desktop release pins these audited AWiki packages exactly. Keep Yarn's
# 24-hour quarantine enabled for every other dependency.
npmPreapprovedPackages:
  - '@awiki/dsh-plugin@0.3.9'
  - '@awiki/dsh-model-proxy@0.1.5'
  - '@agent-network-protocol/dsh-anp-identity@0.1.0'
  - '@awiki/im-core-node@0.2.3'
  - '@awiki/im-core-node-darwin-arm64@0.2.3'
  - '@awiki/im-core-node-darwin-x64@0.2.3'
  - '@awiki/im-core-node-linux-arm64-gnu@0.2.3'
  - '@awiki/im-core-node-linux-x64-gnu@0.2.3'
  - '@awiki/im-core-node-win32-x64-msvc@0.2.3'
  - '@agent-network-protocol/anp-identity@0.2.0'
  - '@agent-network-protocol/anp-identity-darwin-arm64@0.2.0'
  - '@agent-network-protocol/anp-identity-darwin-x64@0.2.0'
  - '@agent-network-protocol/anp-identity-linux-arm64-gnu@0.2.0'
  - '@agent-network-protocol/anp-identity-linux-x64-gnu@0.2.0'
  - '@agent-network-protocol/anp-identity-win32-x64-msvc@0.2.0'

# macOS releases are universal, so the physical node_modules tree must contain
# both Darwin CPU variants before Electron Builder assembles the two slices.
supportedArchitectures:
  os:
    - current
  cpu:
    - current
    - x64
    - arm64
