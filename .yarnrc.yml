enableScripts: false
nmHoistingLimits: workspaces
nodeLinker: node-modules

# The Desktop release pins these audited AWiki packages exactly. Keep Yarn's
# 24-hour quarantine enabled for every other dependency.
npmPreapprovedPackages:
  - '@awiki/dsh-plugin@0.3.1-rc.1'
  - '@awiki/dsh-model-proxy@0.1.1-rc.1'
  - '@awiki/im-core-node@0.1.6'
  - '@awiki/im-core-node-darwin-arm64@0.1.6'
  - '@awiki/im-core-node-darwin-x64@0.1.6'
  - '@awiki/im-core-node-linux-arm64-gnu@0.1.6'
  - '@awiki/im-core-node-linux-x64-gnu@0.1.6'
  - '@awiki/im-core-node-win32-x64-msvc@0.1.6'

# macOS releases are universal, so the physical node_modules tree must contain
# both Darwin CPU variants before Electron Builder assembles the two slices.
supportedArchitectures:
  os:
    - current
  cpu:
    - current
    - x64
    - arm64
